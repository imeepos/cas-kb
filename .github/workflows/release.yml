name: release

# 构建发布流水线:推送 v* 标签触发「质量门禁 → 多平台构建 → GitHub Release」。
# 也支持 workflow_dispatch 手动触发(只跑到构建,不发布,用于验证流水线本身)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1) 发布前统一质量门禁,与 ci.yml 同源:gofmt/构建/vet/单元/集成 + 端到端。
  #    标签可能指向未经 CI 的历史提交,发布线自带完整门禁,不依赖 ci 先跑过。
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caskb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 质量门禁(gofmt/构建/vet/单元/集成)
        env:
          KB_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/caskb?sslmode=disable
        run: ./scripts/verify.sh
      - name: 端到端验收(临时目录+临时库,产物不入库)
        run: ./scripts/e2e.sh

  # 2) 多平台交叉编译:CGO 关闭保证纯静态;产物 kb-<版本>-<os>-<arch> 归档上传。
  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 交叉编译并打包(tar.gz / zip)
        id: pack
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION//\//-}"
          EXT=''
          [ "$GOOS" = windows ] && EXT='.exe'
          BIN="kb${EXT}"
          # -X 注入版本号(tag),供 kb version / kb update 比较用
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$BIN" ./cmd/kb
          STAGE="kb-${VERSION}-${GOOS}-${GOARCH}"
          mkdir "$STAGE"
          cp "$BIN" README.md "$STAGE/"
          if [ "$GOOS" = windows ]; then
            ASSET="$STAGE.zip"
            zip -qr "$ASSET" "$STAGE"
          else
            ASSET="$STAGE.tar.gz"
            tar -czf "$ASSET" "$STAGE"
          fi
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.pack.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  # 3) 发布:汇总全部产物,生成 sha256 校验和,创建 GitHub Release(自动生成更新说明)。
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --verify-tag 需要本地 .git;checkout 后 gh 借助令牌可访问 origin
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 sha256sums.txt
        run: |
          cd dist
          sha256sum kb-*.tar.gz kb-*.zip > sha256sums.txt
          cat sha256sums.txt
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes dist/*
